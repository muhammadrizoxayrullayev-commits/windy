<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="windGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="50%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>
    <linearGradient id="windGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background subtle wind aura -->
  <circle cx="50" cy="50" r="46" fill="url(#windGrad1)" opacity="0.1" />

  <!-- Upper sweeping wind gust -->
  <path d="M 12 28 C 30 20, 52 24, 68 30 C 78 34, 86 42, 88 50 C 90 60, 80 66, 70 64 C 60 62, 58 52, 66 46 C 72 42, 80 44, 82 48"
        stroke="url(#windGrad2)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.85" />

  <!-- The stylized kinetic W formed by streamlined airflow ribbons -->
  <!-- Left descent -->
  <path d="M 22 36 L 36 76"
        stroke="url(#windGrad1)" stroke-width="6" stroke-linecap="round" filter="url(#glow)" />
  <!-- Center ascender -->
  <path d="M 36 76 L 50 44"
        stroke="url(#windGrad1)" stroke-width="5.5" stroke-linecap="round" />
  <!-- Center descender -->
  <path d="M 50 44 L 64 76"
        stroke="url(#windGrad2)" stroke-width="5.5" stroke-linecap="round" />
  <!-- Right ascender curving into a breezy slipstream -->
  <path d="M 64 76 L 78 36 C 82 28, 92 30, 94 36"
        stroke="url(#windGrad2)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Little breeze speed streaks -->
  <path d="M 10 50 C 18 50, 24 53, 30 55" stroke="url(#windGrad2)" stroke-width="3" stroke-linecap="round" opacity="0.6" />
  <path d="M 16 68 C 22 68, 26 70, 32 72" stroke="url(#windGrad1)" stroke-width="3" stroke-linecap="round" opacity="0.5" />
</svg>
